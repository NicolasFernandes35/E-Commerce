<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finalizar Compra</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <span class="material-symbols-outlined icon">arrow_back</span>
    <h1 style="color:white; margin:0; padding:0 12px; font-size:1.1rem;">Resumo do pedido</h1>
    <div style="width:48px"></div>
  </header>

  <main style="width:100%; max-width:1100px; margin: 120px auto 80px; padding: 16px;">
    <section id="compra-list"></section>

    <div id="compra-summary" style="margin-top:18px; text-align:right;">
      <strong>Total: R$ <span id="total-amount">0.00</span></strong>
    </div>

    <div style="margin-top:18px; display:flex; gap:8px; justify-content:flex-end;">
      <button id="voltar-btn" class="btn">Voltar</button>
      <button id="encerrar-btn" class="btn primary">Encerrar compra</button>
    </div>
  </main>

  <footer class="footer">Todos direitos reservados</footer>

  <script src="compra.js"></script>
</body>
</html>
